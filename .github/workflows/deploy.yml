name: Deploy

# Ships main to Cloud Run: one image holding the API and the built web app (root Dockerfile).
# Infrastructure is Terraform's (deploy/terraform); this only replaces the image.
# Repository variables come from `terraform output github_variables`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_IMAGE_REPO }}/ta11y:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy revision
        run: |
          gcloud run services update "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE"
